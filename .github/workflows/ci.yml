name: CI

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: research-assistant/backend/go.mod
          cache: true

      - name: gofmt gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Backend tests
        if: runner.os == 'Linux'
        working-directory: research-assistant/backend
        run: |
          go test ./...
          go vet ./...

      - name: Backend race tests
        if: runner.os == 'Linux'
        working-directory: research-assistant/backend
        run: go test -race ./internal/scheduler ./internal/api ./internal/store

      - name: Backend coverage gate
        if: runner.os == 'Linux'
        working-directory: research-assistant/backend
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          awk "BEGIN {exit !($total >= 50)}"

      - name: Docker sandbox tests
        working-directory: research-assistant/docker-sandbox
        run: |
          go test ./...
          go vet ./...

      - name: Docker core tests
        if: runner.os == 'Linux'
        working-directory: docker-core
        run: |
          go test ./...
          go vet ./...

      - name: Docker core build (Windows)
        if: runner.os == 'Windows'
        working-directory: docker-core
        run: go build ./...

      - name: Tool build (Windows)
        if: runner.os == 'Windows'
        working-directory: tool
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research-assistant/frontend/package-lock.json
      - name: Install
        working-directory: research-assistant/frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: research-assistant/frontend
        run: npm run build
      - name: Bundle budget
        working-directory: research-assistant/frontend
        run: npm run check:bundle
      - name: Lint
        working-directory: research-assistant/frontend
        run: npm run lint
      - name: Test
        working-directory: research-assistant/frontend
        run: npm test
      - name: Install Playwright browser
        working-directory: research-assistant/frontend
        run: npx playwright install --with-deps chromium
      - name: Accessibility smoke
        working-directory: research-assistant/frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview-a11y.log 2>&1 &
          node -e "const started=Date.now();(async()=>{while(Date.now()-started<30000){try{const r=await fetch('http://127.0.0.1:4173');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)})()"
          E2E_BASE_URL=http://127.0.0.1:4173 npm run test:a11y

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research-assistant/frontend/package-lock.json
      - name: Install
        working-directory: research-assistant/frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser and CJK fonts
        working-directory: research-assistant/frontend
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build
        working-directory: research-assistant/frontend
        run: npm run build
      - name: Start preview
        working-directory: research-assistant/frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          node -e "const started=Date.now();(async()=>{while(Date.now()-started<30000){try{const r=await fetch('http://127.0.0.1:4173');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)})()"
      - name: Visual regression
        working-directory: research-assistant/frontend
        run: npm run test:visual

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research optimizer tests
        working-directory: research-assistant/research-optimizer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Paper example tests
        working-directory: research-assistant
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s examples/paper-reproduction -p 'test_*.py'
      - name: AutoResearch example tests
        working-directory: research-assistant
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s examples/autoresearch/intent_router -p 'test_*.py'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t research-assistant-backend:ci research-assistant/backend
      - name: Build sandbox image
        run: docker build -t research-assistant-sandbox:ci research-assistant/docker-sandbox
      - name: Build frontend image
        run: docker build -t research-assistant-frontend:ci research-assistant/frontend
