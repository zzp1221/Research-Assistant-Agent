name: Update visual snapshots

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research-assistant/frontend/package-lock.json
      - name: Install
        working-directory: research-assistant/frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser and CJK fonts
        working-directory: research-assistant/frontend
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build
        working-directory: research-assistant/frontend
        run: npm run build
      - name: Start preview
        working-directory: research-assistant/frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          node -e "const started=Date.now();(async()=>{while(Date.now()-started<60000){try{const r=await fetch('http://127.0.0.1:4173');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)})()"
      - name: Update snapshots
        working-directory: research-assistant/frontend
        run: npx playwright test --config playwright.visual.config.ts --update-snapshots
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: research-assistant/frontend/test/visual/ui.spec.ts-snapshots
          if-no-files-found: error
