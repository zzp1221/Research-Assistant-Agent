# Deterministic E2E overlay: the container suite exercises the runtime model
# profile + visual verification pipeline, so it pins the template planner to
# remove LLM plan-shape variance and allows the private mock provider.
# Usage:
#   docker compose -f docker-compose.yml -f test/docker-compose.e2e.yml --profile e2e up -d
services:
  backend:
    environment:
      - PLANNER_AGENT_ENABLED=false
      - ALLOW_PRIVATE_MODEL_ENDPOINTS=true
      # The document-intelligence suite exercises full 20-page OCR and the
      # mixed text/scan path, so it raises the per-extraction OCR budget and
      # disables the cross-upload cache to keep every assertion deterministic.
      - PDF_OCR_MAX_PAGES=20
      - PDF_OCR_LANG=eng+chi_sim
      - DOCUMENT_CACHE_DISABLED=true
