services:
  # 1. Sandbox control plane: authenticated API, no Docker socket, no host workspace.
  docker-sandbox:
    build: ./docker-sandbox
    ports:
      - "127.0.0.1:${SANDBOX_HOST_PORT:-8082}:8082"
    environment:
      - SANDBOX_MODE=gateway
      - SANDBOX_UPSTREAM_URL=http://docker-sandbox-executor:8082
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:?SANDBOX_API_TOKEN must be set in research-assistant/.env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    depends_on:
      docker-sandbox-executor:
        condition: service_started
    networks:
      - research-assistant-network

  # 1b. Sandbox execution plane: the only service allowed to hold the Docker socket.
  docker-sandbox-executor:
    build: ./docker-sandbox
    volumes:
      # High-privilege execution boundary. It is intentionally not published.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - SANDBOX_MODE=engine
      - SANDBOX_DOCKER_GPUS=${SANDBOX_DOCKER_GPUS:-}
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:?SANDBOX_API_TOKEN must be set in research-assistant/.env}
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-2}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-4g}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-256}
      - SANDBOX_NETWORK_MODE=${SANDBOX_NETWORK_MODE:-none}
      - SANDBOX_ALLOW_NETWORK=${SANDBOX_ALLOW_NETWORK:-true}
      - SANDBOX_SECURITY_PROFILE=${SANDBOX_SECURITY_PROFILE:-standard}
      - SANDBOX_CONTAINER_USER=${SANDBOX_CONTAINER_USER:-}
      - SANDBOX_READ_ONLY_ROOT=${SANDBOX_READ_ONLY_ROOT:-false}
      - SANDBOX_RUNTIME=${SANDBOX_RUNTIME:-}
      - SANDBOX_ALLOWED_RUNTIMES=${SANDBOX_ALLOWED_RUNTIMES:-runc,runsc,nvidia}
      - SANDBOX_WORKSPACE_ROOTS=/tmp
      - SANDBOX_IMAGE_ALLOWLIST=${SANDBOX_IMAGE_ALLOWLIST:-python:3.9-bullseye,python:3.11-bullseye}
      - SANDBOX_REGISTRY_MIRROR=${SANDBOX_REGISTRY_MIRROR:-}
      - SANDBOX_TTL_MINUTES=${SANDBOX_TTL_MINUTES:-120}
      - SANDBOX_REAPER_INTERVAL_SECONDS=${SANDBOX_REAPER_INTERVAL_SECONDS:-300}
      - SANDBOX_PIP_CACHE_DIR=${SANDBOX_PIP_CACHE_DIR:-/tmp/research-assistant-pip-cache}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    networks:
      - research-assistant-network

  # 2. Python 科研优化服务：数据特征、候选选择和跨任务经验
  research-optimizer:
    build: ./research-optimizer
    ports:
      - "127.0.0.1:${OPTIMIZER_HOST_PORT:-8090}:8090"
    volumes:
      - research-assistant-experience-data:/data
    environment:
      - RESEARCH_OPTIMIZER_API_TOKEN=${RESEARCH_OPTIMIZER_API_TOKEN:?RESEARCH_OPTIMIZER_API_TOKEN must be set in research-assistant/.env}
      - RESEARCH_OPTIMIZER_DB_PATH=/data/experiences.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - research-assistant-network

  # 2b. Optional AI intent recognition service (real LLM, not mock)
  intent-recognition:
    build:
      context: ./ai-services/intent_recognition
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "127.0.0.1:${INTENT_SERVICE_HOST_PORT:-18000}:8000"
    env_file:
      - ./backend.env
    environment:
      - INTENT_SERVICE_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    networks:
      - research-assistant-network

  # 3. Go 后端调度引擎
  backend:
    build:
      context: ./backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - /tmp:/tmp
      - ../docker-core/config:/app/config:ro
      - research-assistant-plan-data:/app/data
      - research-assistant-upload-data:/app/uploads
      - research-assistant-benchmark-private-data:/app/private-benchmarks
    env_file:
      - ./backend.env
    environment:
      - SANDBOX_URL=http://docker-sandbox:8082
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:?SANDBOX_API_TOKEN must be set in research-assistant/.env}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set in research-assistant/.env}
      - REQUIRE_API_AUTH=true
      - IDENTITY_COOKIE_SECRET=${IDENTITY_COOKIE_SECRET:-}
      - APPROVAL_TIMEOUT_SECONDS=${APPROVAL_TIMEOUT_SECONDS:-1800}
      - ALLOW_LEGACY_USER_HEADER=${ALLOW_LEGACY_USER_HEADER:-false}
      - PLAN_STORE_PATH=/app/data/plans.json
      - PROJECT_STORE_PATH=/app/data/projects.json
      - BUDGET_STORE_PATH=/app/data/budget.json
      - REVISION_STORE_PATH=/app/data/revisions.json
      - PLAN_REVIEW_MODE=${PLAN_REVIEW_MODE:-}
      - REVIEW_COST_THRESHOLD_USD=${REVIEW_COST_THRESHOLD_USD:-0}
      - QUESTION_TIMEOUT_SECONDS=${QUESTION_TIMEOUT_SECONDS:-900}
      - EXPORT_MAX_FILE_MB=${EXPORT_MAX_FILE_MB:-16}
      - EXPORT_MAX_TOTAL_MB=${EXPORT_MAX_TOTAL_MB:-128}
      - PLAN_MAX_COST_USD=${PLAN_MAX_COST_USD:-0}
      - PLAN_MAX_TOKENS=${PLAN_MAX_TOKENS:-0}
      - PLAN_MAX_SANDBOX_SECONDS=${PLAN_MAX_SANDBOX_SECONDS:-0}
      - PLAN_MAX_DOWNLOAD_BYTES=${PLAN_MAX_DOWNLOAD_BYTES:-0}
      - PLAN_BUDGET_POLICY=${PLAN_BUDGET_POLICY:-soft}
      - UPLOAD_ROOT=/app/uploads
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-32}
      - BENCHMARK_PRIVATE_ROOT=/app/private-benchmarks
      - RESEARCH_OPTIMIZER_URL=http://research-optimizer:8090
      - RESEARCH_OPTIMIZER_API_TOKEN=${RESEARCH_OPTIMIZER_API_TOKEN:?RESEARCH_OPTIMIZER_API_TOKEN must be set in research-assistant/.env}
      - INTENT_SERVICE_URL=http://intent-recognition:8000
      - INTENT_ROUTER_MODE=${INTENT_ROUTER_MODE:-hybrid}
      - INTENT_LLM_CONFIDENCE_THRESHOLD=${INTENT_LLM_CONFIDENCE_THRESHOLD:-0.65}
      - INTENT_CLIENT_TIMEOUT_SECONDS=${INTENT_CLIENT_TIMEOUT_SECONDS:-15}
      - MAX_INTENT_CHARS=${MAX_INTENT_CHARS:-20000}
      - PLAN_RATE_LIMIT_PER_MINUTE=${PLAN_RATE_LIMIT_PER_MINUTE:-10}
      - PLAN_RATE_LIMIT_BURST=${PLAN_RATE_LIMIT_BURST:-3}
      - PLAN_MAX_ACTIVE_PER_USER=${PLAN_MAX_ACTIVE_PER_USER:-3}
      - PLAN_MAX_CONCURRENT_TASKS=${PLAN_MAX_CONCURRENT_TASKS:-4}
      - PLAN_GLOBAL_MAX_TASKS=${PLAN_GLOBAL_MAX_TASKS:-8}
      - PLAN_STALL_SECONDS=${PLAN_STALL_SECONDS:-600}
      - AUDIT_LOG_PATH=/app/data/audit.jsonl
      - UPLOAD_USER_QUOTA_MB=${UPLOAD_USER_QUOTA_MB:-512}
      - UPLOAD_MAX_FILES=${UPLOAD_MAX_FILES:-100}
      - UPLOAD_TTL_DAYS=${UPLOAD_TTL_DAYS:-30}
      - CLAMAV_ADDR=${CLAMAV_ADDR:-}
      - PDF_PARSE_TIMEOUT_SECONDS=${PDF_PARSE_TIMEOUT_SECONDS:-90}
      - PDF_PARSE_MAX_MB=${PDF_PARSE_MAX_MB:-128}
      - PDF_OCR_MAX_PAGES=${PDF_OCR_MAX_PAGES:-5}
      - PDF_OCR_TIMEOUT_SECONDS=${PDF_OCR_TIMEOUT_SECONDS:-60}
      - PDF_OCR_LANG=${PDF_OCR_LANG:-eng+chi_sim}
      - PDF_OCR_MIN_TEXT_CHARS=${PDF_OCR_MIN_TEXT_CHARS:-20}
      - DOCUMENT_CACHE_DIR=${DOCUMENT_CACHE_DIR:-/app/data/document-cache}
      - LITERATURE_CACHE_DIR=/app/data/literature-cache
      - LITERATURE_LIBRARY_DIR=${LITERATURE_LIBRARY_DIR:-/app/data/literature-library}
      - LITERATURE_MAX_RETRIES=${LITERATURE_MAX_RETRIES:-2}
      - LITERATURE_PROVIDER_TIMEOUT_SECONDS=${LITERATURE_PROVIDER_TIMEOUT_SECONDS:-15}
      - WEB_FETCH_MAX_MB=${WEB_FETCH_MAX_MB:-2}
      - WEB_FETCH_TIMEOUT_SECONDS=${WEB_FETCH_TIMEOUT_SECONDS:-15}
      - WEB_FETCH_RESPECT_ROBOTS=${WEB_FETCH_RESPECT_ROBOTS:-true}
      - WEB_FETCH_CACHE_TTL_SECONDS=${WEB_FETCH_CACHE_TTL_SECONDS:-3600}
      - ALLOW_PRIVATE_WEB_FETCH=${ALLOW_PRIVATE_WEB_FETCH:-false}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENALEX_MAILTO=${OPENALEX_MAILTO:-}
      - LLM_PRICE_PROMPT_PER_1K_USD=${LLM_PRICE_PROMPT_PER_1K_USD:-0}
      - LLM_PRICE_COMPLETION_PER_1K_USD=${LLM_PRICE_COMPLETION_PER_1K_USD:-0}
      - HEALTH_VERBOSE=${HEALTH_VERBOSE:-false}
      - MODEL_PROFILE_DIR=${MODEL_PROFILE_DIR:-/app/data/model-profiles}
      - MODEL_PROFILE_ENCRYPTION_KEY=${MODEL_PROFILE_ENCRYPTION_KEY:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MODEL_PROFILE_MAX_PER_USER=${MODEL_PROFILE_MAX_PER_USER:-10}
      - MODEL_PROBE_RATE_LIMIT_SECONDS=${MODEL_PROBE_RATE_LIMIT_SECONDS:-5}
      - VISION_MAX_EDGE_PX=${VISION_MAX_EDGE_PX:-1280}
      - VISION_MAX_IMAGES=${VISION_MAX_IMAGES:-4}
      - VISION_TIMEOUT_SECONDS=${VISION_TIMEOUT_SECONDS:-120}
      - FEATURE_VISION_VERIFICATION=${FEATURE_VISION_VERIFICATION:-true}
      - ALLOW_PRIVATE_MODEL_ENDPOINTS=${ALLOW_PRIVATE_MODEL_ENDPOINTS:-false}
      - PLANNER_AGENT_ENABLED=${PLANNER_AGENT_ENABLED:-true}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    mem_limit: 4g
    depends_on:
      docker-sandbox:
        condition: service_started
      research-optimizer:
        condition: service_healthy
      intent-recognition:
        condition: service_healthy
    networks:
      - research-assistant-network

  # 3b. Deterministic OpenAI-compatible mock used only by the E2E suite.
  # It plays text-only / vision / failing / garbage providers so the vision
  # routing scenarios are reproducible without a paid third-party provider.
  mock-vision:
    image: python:3.11-bullseye
    volumes:
      - ./test/mock:/mock:ro
    command: ["python", "/mock/mock_vision_server.py", "9099"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["e2e"]
    networks:
      - research-assistant-network

  # 4. React 前端界面
  frontend:
    build:
      context: ./frontend
    environment:
      # Injected into nginx at container start; never compiled into the bundle.
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set in research-assistant/.env}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80" # 将容器内的 Nginx 80 端口映射到宿主机 5173
    depends_on:
      - backend
    networks:
      - research-assistant-network

networks:
  research-assistant-network:
    driver: bridge

volumes:
  research-assistant-plan-data:
  research-assistant-upload-data:
  research-assistant-experience-data:
  research-assistant-benchmark-private-data: