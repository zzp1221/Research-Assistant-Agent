services:
  # 1. Sandbox control plane: authenticated API, no Docker socket, no host workspace.
  docker-sandbox:
    build: ./docker-sandbox
    ports:
      - "127.0.0.1:${SANDBOX_HOST_PORT:-8082}:8082"
    environment:
      - SANDBOX_MODE=gateway
      - SANDBOX_UPSTREAM_URL=http://docker-sandbox-executor:8082
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:?SANDBOX_API_TOKEN must be set in research-assistant/.env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    depends_on:
      docker-sandbox-executor:
        condition: service_started
    networks:
      - research-assistant-network

  # 1b. Sandbox execution plane: the only service allowed to hold the Docker socket.
  docker-sandbox-executor:
    build: ./docker-sandbox
    volumes:
      # High-privilege execution boundary. It is intentionally not published.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - SANDBOX_MODE=engine
      - SANDBOX_DOCKER_GPUS=${SANDBOX_DOCKER_GPUS:-}
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:?SANDBOX_API_TOKEN must be set in research-assistant/.env}
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-2}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-4g}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-256}
      - SANDBOX_NETWORK_MODE=${SANDBOX_NETWORK_MODE:-bridge}
      - SANDBOX_WORKSPACE_ROOTS=/tmp
      - SANDBOX_IMAGE_ALLOWLIST=${SANDBOX_IMAGE_ALLOWLIST:-python:3.9-bullseye,python:3.11-bullseye}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    networks:
      - research-assistant-network

  # 2. Python 科研优化服务：数据特征、候选选择和跨任务经验
  research-optimizer:
    build: ./research-optimizer
    ports:
      - "127.0.0.1:${OPTIMIZER_HOST_PORT:-8090}:8090"
    volumes:
      - research-assistant-experience-data:/data
    environment:
      - RESEARCH_OPTIMIZER_API_TOKEN=${RESEARCH_OPTIMIZER_API_TOKEN:?RESEARCH_OPTIMIZER_API_TOKEN must be set in research-assistant/.env}
      - RESEARCH_OPTIMIZER_DB_PATH=/data/experiences.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - research-assistant-network

  # 2b. Optional AI intent recognition service (real LLM, not mock)
  intent-recognition:
    build:
      context: ./ai-services/intent_recognition
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "127.0.0.1:${INTENT_SERVICE_HOST_PORT:-18000}:8000"
    env_file:
      - ./backend.env
    environment:
      - INTENT_SERVICE_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    networks:
      - research-assistant-network

  # 3. Go 后端调度引擎
  backend:
    build:
      context: ./backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - /tmp:/tmp
      - ../docker-core/config:/app/config:ro
      - research-assistant-plan-data:/app/data
      - research-assistant-upload-data:/app/uploads
      - research-assistant-benchmark-private-data:/app/private-benchmarks
    env_file:
      - ./backend.env
    environment:
      - SANDBOX_URL=http://docker-sandbox:8082
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:?SANDBOX_API_TOKEN must be set in research-assistant/.env}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set in research-assistant/.env}
      - REQUIRE_API_AUTH=true
      - PLAN_STORE_PATH=/app/data/plans.json
      - UPLOAD_ROOT=/app/uploads
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-32}
      - BENCHMARK_PRIVATE_ROOT=/app/private-benchmarks
      - RESEARCH_OPTIMIZER_URL=http://research-optimizer:8090
      - RESEARCH_OPTIMIZER_API_TOKEN=${RESEARCH_OPTIMIZER_API_TOKEN:?RESEARCH_OPTIMIZER_API_TOKEN must be set in research-assistant/.env}
      - INTENT_SERVICE_URL=http://intent-recognition:8000
      - INTENT_ROUTER_MODE=${INTENT_ROUTER_MODE:-hybrid}
      - INTENT_LLM_CONFIDENCE_THRESHOLD=${INTENT_LLM_CONFIDENCE_THRESHOLD:-0.65}
      - INTENT_CLIENT_TIMEOUT_SECONDS=${INTENT_CLIENT_TIMEOUT_SECONDS:-15}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    mem_limit: 4g
    depends_on:
      docker-sandbox:
        condition: service_started
      research-optimizer:
        condition: service_healthy
      intent-recognition:
        condition: service_healthy
    networks:
      - research-assistant-network

  # 4. React 前端界面
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set in research-assistant/.env}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80" # 将容器内的 Nginx 80 端口映射到宿主机 5173
    depends_on:
      - backend
    networks:
      - research-assistant-network

networks:
  research-assistant-network:
    driver: bridge

volumes:
  research-assistant-plan-data:
  research-assistant-upload-data:
  research-assistant-experience-data:
  research-assistant-benchmark-private-data:
